plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workplease.sorryfix'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workplease.sorryfix'
        minSdk 26 // Android 8.0
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
